<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSC Smart Tools Portal</title>
  <meta http-equiv="refresh" content="0; url=https://smartcsctools.org/">
  <script>
    window.location.replace("https://smartcsctools.org/");
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .loader {
      border: 4px solid #1e293b;
      border-top: 4px solid #38bdf8;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 15px;
    }
    a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid #38bdf8;
      padding: 8px 16px;
      border-radius: 6px;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="loader"></div>
  <h2>Smart CSC Tools Portal Khul Raha Hai...</h2>
  <p>Agar apne aap na khule, to niche diye button par tap karein:</p>
  <a href="https://smartcsctools.org/">Yahan Click Karein</a>

</body>
</html>
