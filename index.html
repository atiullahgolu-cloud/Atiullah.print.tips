<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>अतिउल्लाह अंसारी - Smart PVC Tool</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Cropper.js for Smooth Mobile & PC Touch Cropping -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

  <style>
    :root {
      --primary: #1e3a8a;
      --accent: #2563eb;
      --success: #16a34a;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #f1f5f9;
      padding-bottom: 40px;
    }
    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: white;
      padding: 20px 15px;
      text-align: center;
      border-bottom: 3px solid #38bdf8;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(to right, #ffffff, #38bdf8, #facc15);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 12px;
    }
    .box {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }
    .upload-btn {
      display: block;
      background: #eff6ff;
      border: 2px dashed #3b82f6;
      border-radius: 8px;
      padding: 25px 15px;
      text-align: center;
      cursor: pointer;
      font-weight: 600;
      color: var(--primary);
    }
    .crop-wrapper {
      max-height: 480px;
      margin-top: 15px;
      display: none;
      background: #000;
      text-align: center;
    }
    .crop-wrapper img {
      max-width: 100%;
      display: block;
    }
    .action-bar {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 15px;
    }
    button {
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
    .btn-front { background: #0284c7; color: white; }
    .btn-back { background: #7c3aed; color: white; }
    .btn-print { background: var(--success); color: white; width: 100%; max-width: 320px; margin: 0 auto; display: block; font-size: 16px; }

    /* Output Card Area */
    .sheet {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
      padding: 15px;
      background: #fafafa;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
    }
    .card-item {
      text-align: center;
    }
    .card-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 5px;
      color: #475569;
    }
    canvas.pvc-canvas {
      width: 85.6mm;
      height: 53.98mm;
      border: 1px solid #111;
      border-radius: 2.5mm;
      background: white;
      display: block;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    /* Print Output Setup */
    @media print {
      body { background: white; padding: 0; }
      header, .upload-btn, .crop-wrapper, .action-bar, .btn-print, .card-title { display: none !important; }
      .box { box-shadow: none; padding: 0; margin: 0; }
      .sheet {
        border: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: row;
        gap: 5mm;
      }
      canvas.pvc-canvas {
        width: 85.6mm !important;
        height: 53.98mm !important;
        box-shadow: none !important;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">अतिउल्लाह अंसारी CSC Tools</div>
    <p style="font-size: 12px; color: #cbd5e1; margin-top: 4px;">Touch & Drag Mobile PVC Crop & Print Portal</p>
  </header>

  <div class="container">
    <div class="box">
      <label class="upload-btn" for="docInput">
        📁 Document (PDF ya Photo) Chunein
      </label>
      <input type="file" id="docInput" accept="application/pdf,image/*" style="display:none">

      <!-- Interactive Touch Cropper -->
      <div class="crop-wrapper" id="cropWrapper">
        <img id="imageToCrop" src="" alt="Document Preview">
      </div>

      <div class="action-bar" id="cropControls" style="display:none;">
        <button class="btn-front" onclick="saveCardSide('front')">✂️ 1. Set Front Side</button>
        <button class="btn-back" onclick="saveCardSide('back')">✂️ 2. Set Back Side</button>
      </div>

      <!-- Live Printable PVC Cards -->
      <div class="sheet">
        <div class="card-item">
          <div class="card-title">Front Side (85.6mm × 53.98mm)</div>
          <canvas id="frontCanvas" class="pvc-canvas"></canvas>
        </div>
        <div class="card-item">
          <div class="card-title">Back Side (85.6mm × 53.98mm)</div>
          <canvas id="backCanvas" class="pvc-canvas"></canvas>
        </div>
      </div>

      <div style="margin-top: 20px;">
        <button class="btn-print" onclick="window.print()">🖨️ Print Direct PVC Size</button>
      </div>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // 300 DPI Standard CR80 PVC dimensions
    const PVC_W = 1011;
    const PVC_H = 638;

    const frontCanvas = document.getElementById('frontCanvas');
    const backCanvas = document.getElementById('backCanvas');
    const fCtx = frontCanvas.getContext('2d');
    const bCtx = backCanvas.getContext('2d');

    frontCanvas.width = PVC_W; frontCanvas.height = PVC_H;
    backCanvas.width = PVC_W; backCanvas.height = PVC_H;
    fCtx.fillStyle = '#ffffff'; fCtx.fillRect(0,0,PVC_W,PVC_H);
    bCtx.fillStyle = '#ffffff'; bCtx.fillRect(0,0,PVC_W,PVC_H);

    let cropper = null;
    const cropWrapper = document.getElementById('cropWrapper');
    const imageToCrop = document.getElementById('imageToCrop');
    const cropControls = document.getElementById('cropControls');

    document.getElementById('docInput').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      if (file.type === 'application/pdf') {
        const buffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
        const page = await pdf.getPage(1);
        const viewport = page.getViewport({ scale: 2.0 });
        const c = document.createElement('canvas');
        c.width = viewport.width;
        c.height = viewport.height;
        await page.render({ canvasContext: c.getContext('2d'), viewport: viewport }).promise;
        initCropper(c.toDataURL());
      } else {
        const reader = new FileReader();
        reader.onload = (evt) => initCropper(evt.target.result);
        reader.readAsDataURL(file);
      }
    });

    function initCropper(src) {
      imageToCrop.src = src;
      cropWrapper.style.display = 'block';
      cropControls.style.display = 'flex';

      if (cropper) cropper.destroy();

      cropper = new Cropper(imageToCrop, {
        aspectRatio: PVC_W / PVC_H, // Fixed exact PVC ratio
        viewMode: 1,
        autoCropArea: 0.8,
        responsive: true
      });
    }

    function saveCardSide(side) {
      if (!cropper) return;
      const croppedCanvas = cropper.getCroppedCanvas({ width: PVC_W, height: PVC_H });
      if (side === 'front') {
        fCtx.clearRect(0, 0, PVC_W, PVC_H);
        fCtx.drawImage(croppedCanvas, 0, 0, PVC_W, PVC_H);
      } else {
        bCtx.clearRect(0, 0, PVC_W, PVC_H);
        bCtx.drawImage(croppedCanvas, 0, 0, PVC_W, PVC_H);
      }
    }
  </script>
</body>
</html>
